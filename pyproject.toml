[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-identifiability"
version = "1.0.0"
description = "Task-aware low-rank reconstruction of an effective attention score matrix"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.6.0",
  "numpy==2.2.3",
  "pandas==2.2.3",
  "matplotlib==3.10.1",
]

[tool.setuptools.packages.find]
where = ["src"]

